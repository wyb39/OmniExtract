<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OmniExtract</title>
<link rel="icon" href="/omniextract/assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="/omniextract/assets/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
.form-select{width:100%;height:38px;border:1px solid #e1e5e9;border-radius:6px;padding:0 36px 0 12px;font-size:14px;line-height:38px;background-color:#fff;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236b7280' d='M6 8L0 0h12z'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:12px 8px;-webkit-appearance:none;-moz-appearance:none;appearance:none;transition:border-color .2s ease,box-shadow .2s ease}
.form-select:hover{border-color:#cbd5e1}
.form-select:focus{outline:none;border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.25)}
.form-select:disabled{color:#9ca3af;background-color:#f8fafc;cursor:not-allowed}
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <a href="/omniextract/" style="text-decoration: none; color: inherit;">
      <div class="logo-container">
        <img src="/omniextract/assets/img/logo.png" class="logo">
        <h1 class="app-title">OmniExtract</h1>
      </div>
    </a>
    <div class="nav-links">
      <a id="nav-model-config" class="nav-link" href="/omniextract/model-config">Model Configuration</a>
      <a id="nav-doc-extraction-original" class="nav-link" href="/omniextract/doc-extraction-original">Document Extraction-Original</a>
      <a id="nav-doc-extraction-optimized" class="nav-link" href="/omniextract/doc-extraction-optimized">Document Extraction Optimized</a>
      <a id="nav-prompt-optimization" class="nav-link" href="/omniextract/prompt-optimization">Prompt Optimization</a>
      <a id="nav-table-parsing" class="nav-link" href="/omniextract/table-parsing">Table Extraction</a>
    </div>
  </div>
  
</nav>

<div id="page-content" class="page-content">
{% block content %}{% endblock %}
</div>

<script>
function validateEmailValue(email) {
  var value = (email || '').trim();
  if (!value) {
    return { valid: true, message: '' };
  }
  var pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!pattern.test(value)) {
    return { valid: false, message: 'Please enter a valid email address.' };
  }
  return { valid: true, message: '' };
}

function validateEmailInputById(inputId) {
  var input = document.getElementById(inputId);
  if (!input) {
    return true;
  }
  var result = validateEmailValue(input.value);
  var group = input.closest('.form-group');
  var errorEl = group ? group.querySelector('.email-error') : null;
  if (!result.valid) {
    if (errorEl) {
      errorEl.textContent = result.message;
      errorEl.style.display = 'block';
    } else {
      alert(result.message);
    }
    input.focus();
    return false;
  } else {
    if (errorEl) {
      errorEl.textContent = '';
      errorEl.style.display = 'none';
    }
    return true;
  }
}

document.addEventListener('DOMContentLoaded', function () {
  var emailInputs = document.querySelectorAll('.email-input');
  emailInputs.forEach(function (input) {
    input.addEventListener('input', function () {
      var group = input.closest('.form-group');
      var errorEl = group ? group.querySelector('.email-error') : null;
      if (errorEl && errorEl.style.display === 'block') {
        var result = validateEmailValue(input.value);
        if (result.valid) {
          errorEl.textContent = '';
          errorEl.style.display = 'none';
        }
      }
    });
    input.addEventListener('blur', function () {
      validateEmailInputById(input.id);
    });
  });
});
</script>

</body>
</html>
